<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — CR-SMART</title>
  <!-- Fonts and icons are stored locally in vendor/ so the dashboard works without internet -->
  <link rel="stylesheet" href="vendor/fonts/fonts.css">
  <link rel="stylesheet" href="vendor/fontawesome/css/fontawesome.min.css">
  <link rel="stylesheet" href="vendor/fontawesome/css/solid.min.css">
  <link rel="stylesheet" href="vendor/fontawesome/css/regular.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login" class="login-page">
  <div id="app-header"></div>

  <main class="main">
    <section class="login-card">
      <div class="login-welcome">
        <img src="assets/logo.png" alt="CSUCC seal">
        <span class="pill"><i class="fa-solid fa-lock"></i> CSUCC Secure Access</span>
        <h1>Welcome Back</h1>
        <p>Sign in to access your dashboard, monitor comfort room conditions in real time, and manage CR-SMART system operations.</p>
      </div>

      <form class="login-form" id="login-form" novalidate>
        <h2>Sign In to Account</h2>

        <div class="field">
          <label for="username">Username <span class="req">*</span></label>
          <div class="input-wrap">
            <i class="fa-solid fa-user lead"></i>
            <input id="username" type="text" placeholder="Enter your username" autocomplete="username">
          </div>
        </div>

        <div class="field">
          <label for="password">Password <span class="req">*</span></label>
          <div class="input-wrap">
            <i class="fa-solid fa-lock lead"></i>
            <input id="password" type="password" placeholder="Enter your password" autocomplete="current-password">
            <button type="button" class="toggle-eye" id="toggle-eye" aria-label="Show password"><i class="fa-regular fa-eye"></i></button>
          </div>
        </div>

        <div class="form-error" id="form-error"></div>
        <button type="submit" class="btn-primary"><i class="fa-solid fa-right-to-bracket"></i> Sign In</button>
        <p class="login-alt">Don't have an account? <a href="#" data-soon="Registration">Please register here</a></p>
      </form>
    </section>
  </main>

  <div id="app-footer"></div>

  <script src="js/layout.js"></script>
  <script>
    // Prototype sign-in: checks that both fields are filled, then opens the dashboard.
    // Real authentication (database + password hashing) is not part of this prototype.
    const form = document.getElementById('login-form');
    const errorBox = document.getElementById('form-error');
    const password = document.getElementById('password');

    document.getElementById('toggle-eye').addEventListener('click', (e) => {
      const show = password.type === 'password';
      password.type = show ? 'text' : 'password';
      e.currentTarget.innerHTML = show ? '<i class="fa-regular fa-eye-slash"></i>' : '<i class="fa-regular fa-eye"></i>';
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      if (!username || !password.value) {
        errorBox.textContent = 'Please enter both your username and password.';
        return;
      }
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
